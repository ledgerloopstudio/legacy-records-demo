<script id="engine">
/* ===== ENGINE: pure functions, no DOM. Unit-testable in plain Node. =====
   Legacy & Emergency Records Organizer.
   This organises RECORDS. It contains no legal instrument, no will template,
   no power-of-attorney form, and gives no legal or financial advice.
*/

/* The eight record sections. `critical` = the shop's judgement of what a family
   most urgently needs to find; it drives the gap detector, nothing else. */
var SECTIONS = [
  { id: "documents", label: "Documents", critical: true },
  { id: "accounts", label: "Accounts", critical: true },
  { id: "insurance", label: "Insurance", critical: true },
  { id: "medical", label: "Medical", critical: true },
  { id: "contacts", label: "Contacts", critical: true },
  { id: "property", label: "Property", critical: false },
  { id: "digital", label: "Digital", critical: false },
  { id: "wishes", label: "Final Wishes", critical: false }
];

/* How stale a record is allowed to get before it should be re-checked. */
var REVIEW_MONTHS = 12;

function parseISO(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}

function toISO(d) {
  if (!d) return "";
  var m = String(d.getMonth() + 1), day = String(d.getDate());
  if (m.length < 2) m = "0" + m;
  if (day.length < 2) day = "0" + day;
  return d.getFullYear() + "-" + m + "-" + day;
}

function monthsBetween(fromISO, toISOstr) {
  var a = parseISO(fromISO), b = parseISO(toISOstr);
  if (!a || !b) return null;
  return Math.round((b - a) / (86400000 * 30.4375) * 10) / 10;
}

function sectionById(id) {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
  return null;
}

function recordsIn(records, sectionId) {
  return records.filter(function (r) { return r.section === sectionId; });
}

/* A record counts as complete when it has a title, a location (where the real
   thing physically or digitally lives) and a reviewed date. */
function isComplete(r) {
  return !!(r && String(r.title || "").trim() &&
    String(r.location || "").trim() &&
    String(r.reviewed || "").trim());
}

function missingFields(r) {
  var out = [];
  if (!String(r.title || "").trim()) out.push("title");
  if (!String(r.location || "").trim()) out.push("location");
  if (!String(r.reviewed || "").trim()) out.push("reviewed");
  return out;
}

/* Stale = reviewed longer ago than REVIEW_MONTHS. Never reviewed is "unknown",
   not stale — the gap detector reports that separately. */
function isStale(r, todayISO, months) {
  var limit = months === undefined ? REVIEW_MONTHS : months;
  if (!r || !r.reviewed) return false;
  var m = monthsBetween(r.reviewed, todayISO);
  if (m === null) return false;
  return m > limit;
}

function staleRecords(records, todayISO, months) {
  return records.filter(function (r) { return isStale(r, todayISO, months); });
}

function completionPct(records) {
  if (!records.length) return null;
  var n = records.filter(isComplete).length;
  return Math.round((n / records.length) * 100);
}

function sectionCompletion(records) {
  var out = {};
  SECTIONS.forEach(function (s) {
    var mine = recordsIn(records, s.id);
    out[s.id] = { count: mine.length, complete: mine.filter(isComplete).length, pct: completionPct(mine) };
  });
  return out;
}

/* Overall readiness: share of complete records across every section that has
   any records at all. Empty sections are reported by the gap detector instead. */
function readinessScore(records) {
  if (!records.length) return 0;
  return Math.round((records.filter(isComplete).length / records.length) * 100);
}

/* THE GAP DETECTOR — the thing a static printable cannot do.
   Returns an ordered list of concrete, actionable gaps. */
function gaps(records, todayISO) {
  var out = [];

  SECTIONS.forEach(function (s) {
    var mine = recordsIn(records, s.id);
    if (!mine.length) {
      out.push({
        kind: "empty-section",
        section: s.id,
        severity: s.critical ? "critical" : "normal",
        message: "No " + s.label + " records added yet"
      });
    }
  });

  records.forEach(function (r) {
    var miss = missingFields(r);
    if (miss.length) {
      out.push({
        kind: "incomplete-record",
        section: r.section,
        id: r.id,
        severity: miss.indexOf("location") !== -1 ? "critical" : "normal",
        message: (r.title || "Untitled record") + " is missing: " + miss.join(", ")
      });
    }
  });

  staleRecords(records, todayISO).forEach(function (r) {
    out.push({
      kind: "stale-record",
      section: r.section,
      id: r.id,
      severity: "normal",
      message: (r.title || "Untitled record") + " has not been reviewed in over " +
        REVIEW_MONTHS + " months"
    });
  });

  var order = { critical: 0, normal: 1 };
  return out.sort(function (a, b) { return order[a.severity] - order[b.severity]; });
}

function criticalGaps(records, todayISO) {
  return gaps(records, todayISO).filter(function (g) { return g.severity === "critical"; });
}

function countBySeverity(records, todayISO) {
  var g = gaps(records, todayISO), out = { critical: 0, normal: 0 };
  g.forEach(function (x) { out[x.severity]++; });
  return out;
}

/* Contacts flagged as the people who must be told first. */
function primaryContacts(records) {
  return recordsIn(records, "contacts").filter(function (r) { return r.primary === true; });
}

/* Records the owner marked as needing a physical copy in the binder. */
function printPack(records) {
  return records.filter(function (r) { return r.inBinder === true; })
    .sort(function (a, b) {
      var sa = SECTIONS.map(function (s) { return s.id; }).indexOf(a.section);
      var sb = SECTIONS.map(function (s) { return s.id; }).indexOf(b.section);
      if (sa !== sb) return sa - sb;
      return String(a.title || "").localeCompare(String(b.title || ""));
    });
}

function nextReviewDate(records, todayISO) {
  var dated = records.filter(function (r) { return r.reviewed; });
  if (!dated.length) return null;
  var oldest = dated.slice().sort(function (a, b) {
    return String(a.reviewed).localeCompare(String(b.reviewed));
  })[0];
  var d = parseISO(oldest.reviewed);
  if (!d) return null;
  d.setMonth(d.getMonth() + REVIEW_MONTHS);
  return toISO(d);
}

function summaryReport(state, todayISO) {
  var recs = state.records || [];
  var sev = countBySeverity(recs, todayISO);
  return {
    total: recs.length,
    complete: recs.filter(isComplete).length,
    readiness: readinessScore(recs),
    criticalGaps: sev.critical,
    otherGaps: sev.normal,
    stale: staleRecords(recs, todayISO).length,
    sections: sectionCompletion(recs),
    inBinder: printPack(recs).length,
    primaryContacts: primaryContacts(recs).length,
    nextReview: nextReviewDate(recs, todayISO)
  };
}

function toCSV(records) {
  var head = ["Section", "Title", "Where it is", "Reference / account", "Contact",
    "Last reviewed", "In binder", "Notes"];
  var lines = [head.join(",")];
  records.forEach(function (r) {
    var s = sectionById(r.section);
    var row = [s ? s.label : r.section, r.title, r.location, r.reference,
    r.contact, r.reviewed, r.inBinder ? "Yes" : "No", r.notes];
    lines.push(row.map(function (v) {
      var t = (v === null || v === undefined) ? "" : String(v);
      return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }).join(","));
  });
  return lines.join("\n");
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    SECTIONS: SECTIONS, REVIEW_MONTHS: REVIEW_MONTHS,
    parseISO: parseISO, toISO: toISO, monthsBetween: monthsBetween,
    sectionById: sectionById, recordsIn: recordsIn,
    isComplete: isComplete, missingFields: missingFields,
    isStale: isStale, staleRecords: staleRecords,
    completionPct: completionPct, sectionCompletion: sectionCompletion,
    readinessScore: readinessScore, gaps: gaps, criticalGaps: criticalGaps,
    countBySeverity: countBySeverity, primaryContacts: primaryContacts,
    printPack: printPack, nextReviewDate: nextReviewDate,
    summaryReport: summaryReport, toCSV: toCSV
  };
}
</script>
<script id="uiapp">
/* ===== UI ===== */
var KEY = "llsLegacyRecords_v1";
/* ---- demo-only limit: this block exists only in the public try-it demo, never in the sold product ---- */
var DEMO_MODE = true, DEMO_RECORD_LIMIT = 28; /* 13 seeded + 15 room to try adding your own */
function demoLimitReached(){
  if(!DEMO_MODE) return false;

  alert("You've reached the "+DEMO_RECORD_LIMIT+"-record demo limit.\n\nThis is just a preview — buy the full version for unlimited records, all features unlocked, and your own permanent copy.");

}
var STATE = null, VIEW = "dash", MODAL = null, EDIT = null, SEC = "documents";
var TABS = [
  ["dash", "Dashboard"], ["records", "All Records"], ["sections", "By Section"],
  ["gaps", "What's Missing"], ["contacts", "Key Contacts"], ["wishes", "Final Wishes"],
  ["binder", "Print Pack"], ["reports", "Reports"]
];

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function todayISO() { return toISO(new Date()); }

function blank() { return { records: [], settings: { dark: "0", owner: "", updated: "" } }; }

function seed() {
  var d = new Date(), iso = function (off) { var x = new Date(d); x.setMonth(x.getMonth() + off); return toISO(x); };
  return {
    records: [
      { id: uid(), section: "documents", title: "Passport", location: "Fireproof box, study cupboard", reference: "", contact: "", reviewed: iso(-1), inBinder: true, notes: "" },
      { id: uid(), section: "documents", title: "Birth certificate", location: "Fireproof box, study cupboard", reference: "", contact: "", reviewed: iso(-20), inBinder: true, notes: "Original, not a copy" },
      { id: uid(), section: "documents", title: "Property deed", location: "", reference: "", contact: "Hale & Co", reviewed: iso(-2), inBinder: false, notes: "Check with solicitor where original is held" },
      { id: uid(), section: "accounts", title: "Main current account", location: "Bank app + paper statements, top drawer", reference: "ends 4821", contact: "", reviewed: iso(-2), inBinder: true, notes: "" },
      { id: uid(), section: "accounts", title: "Workplace pension", location: "Provider online portal", reference: "", contact: "", reviewed: iso(-3), inBinder: true, notes: "" },
      { id: uid(), section: "insurance", title: "Life insurance policy", location: "Blue folder, filing cabinet", reference: "", contact: "", reviewed: "", inBinder: true, notes: "Confirm beneficiary is current" },
      { id: uid(), section: "medical", title: "Medication list", location: "Kitchen drawer and phone notes", reference: "", contact: "Family doctor", reviewed: iso(0), inBinder: true, notes: "" },
      { id: uid(), section: "medical", title: "Allergies & conditions", location: "Same sheet as medication list", reference: "", contact: "", reviewed: iso(0), inBinder: true, notes: "" },
      { id: uid(), section: "contacts", title: "Sister (first person to call)", location: "Phone contacts", reference: "", contact: "", reviewed: iso(-1), inBinder: true, primary: true, notes: "" },
      { id: uid(), section: "contacts", title: "Solicitor", location: "Business card, desk tidy", reference: "", contact: "Hale & Co", reviewed: iso(-4), inBinder: true, primary: false, notes: "" },
      { id: uid(), section: "contacts", title: "Accountant", location: "Email contacts", reference: "", contact: "", reviewed: iso(-6), inBinder: false, primary: false, notes: "" },
      { id: uid(), section: "digital", title: "Password manager", location: "Master password sealed with the binder", reference: "", contact: "", reviewed: iso(-1), inBinder: true, notes: "Do not write the master password in this file" },
      { id: uid(), section: "wishes", title: "Funeral preferences", location: "Written page at front of binder", reference: "", contact: "", reviewed: iso(-1), inBinder: true, notes: "" }
    ],
    settings: { dark: "0", owner: "", updated: todayISO() }
  };
}

function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) STATE = JSON.parse(raw); } catch (e) { STATE = null; }
  if (!STATE || !STATE.records) STATE = seed();
  if (!STATE.settings) STATE.settings = { dark: "0", owner: "", updated: "" };
  document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
}
function save() {
  STATE.settings.updated = todayISO();
  try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) { }
}

function el(tag, attrs, html) {
  var a = "";
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) a += " " + k + '="' + String(attrs[k]).replace(/"/g, "&quot;") + '"';
  return "<" + tag + a + ">" + (html === undefined ? "" : html) + "</" + tag + ">";
}

function secLabel(id) { var s = sectionById(id); return s ? s.label : id; }
function secOpts(sel) {
  return SECTIONS.map(function (s) {
    return el("option", { value: s.id, selected: s.id === sel ? "selected" : null }, esc(s.label));
  }).join("");
}

function statusPill(r) {
  var miss = missingFields(r);
  if (miss.length) return el("span", { "class": "pill " + (miss.indexOf("location") !== -1 ? "red" : "amber") },
    "Missing " + miss.join(", "));
  if (isStale(r, todayISO())) return el("span", { "class": "pill gold" }, "Needs review");
  return el("span", { "class": "pill ok" }, "Complete");
}

/* ---------- views ---------- */

function viewDash() {
  var t = todayISO(), r = summaryReport(STATE, t);
  var crit = criticalGaps(STATE.records, t);

  var kpis = el("div", { "class": "grid g4" },
    el("div", { "class": "card" }, el("h3", {}, "Readiness") +
      el("div", { "class": "kpi" }, r.readiness + "%") +
      el("div", { "class": "note" }, r.complete + " of " + r.total + " records complete")) +
    el("div", { "class": "card" }, el("h3", {}, "Critical gaps") +
      el("div", { "class": "kpi " + (r.criticalGaps ? "bad" : "") }, r.criticalGaps) +
      el("div", { "class": "note" }, r.criticalGaps ? "Fix these first" : "Nothing critical outstanding")) +
    el("div", { "class": "card" }, el("h3", {}, "Needs review") +
      el("div", { "class": "kpi " + (r.stale ? "warn" : "") }, r.stale) +
      el("div", { "class": "note" }, "Not checked in over " + REVIEW_MONTHS + " months")) +
    el("div", { "class": "card" }, el("h3", {}, "In the binder") +
      el("div", { "class": "kpi ink" }, r.inBinder) +
      el("div", { "class": "note" }, "Marked for a printed copy"))
  );

  var bar = el("div", { "class": "card" },
    el("h3", {}, "Overall progress") +
    el("div", { "class": "row" }, el("div", { style: "flex:1" }, el("div", { "class": "bar" },
      el("i", { "class": r.readiness >= 80 ? "" : r.readiness >= 50 ? "warn" : "bad", style: "width:" + r.readiness + "%" }))) +
      el("b", {}, r.readiness + "%")) +
    el("div", { "class": "note" }, r.otherGaps + " other item" + (r.otherGaps === 1 ? "" : "s") +
      " still to complete" + (r.nextReview ? " · oldest record last reviewed before " + esc(r.nextReview) : "")));

  var critCard = el("div", { "class": "card" }, el("h3", {}, "Fix these first") +
    (crit.length
      ? el("div", { "class": "tblwrap" }, el("table", {}, crit.slice(0, 8).map(function (g) {
        return el("tr", {}, el("td", {}, esc(g.message)) +
          el("td", { style: "text-align:right" }, el("span", { "class": "pill red" }, esc(secLabel(g.section)))));
      }).join("")))
      : el("div", { "class": "note" }, "No critical gaps. Keep the records reviewed and that stays true.")));

  var secRows = SECTIONS.map(function (s) {
    var d = r.sections[s.id];
    var pct = d.pct === null ? 0 : d.pct;
    return el("tr", {},
      el("td", {}, esc(s.label) + (s.critical ? " " + el("span", { "class": "pill red" }, "key") : "")) +
      el("td", {}, d.count) +
      el("td", { style: "width:45%" }, el("div", { "class": "bar" },
        el("i", { "class": pct >= 80 ? "" : pct >= 50 ? "warn" : "bad", style: "width:" + pct + "%" }))) +
      el("td", {}, d.count ? pct + "%" : "—"));
  }).join("");

  var secCard = el("div", { "class": "card" }, el("h3", {}, "Section by section") +
    el("div", { "class": "tblwrap" }, el("table", {},
      el("tr", {}, ["Section", "Records", "", "Complete"].map(function (h) { return el("th", {}, h); }).join("")) + secRows)));

  return el("h2", {}, "Dashboard") +
    el("div", { "class": "sub" }, "What is recorded, what is missing, and what needs checking again.") +
    kpis + el("div", { style: "height:14px" }) + bar + el("div", { style: "height:14px" }) +
    el("div", { "class": "grid g2" }, critCard + secCard);
}

function recordRow(r, withSection) {
  return el("tr", {},
    (withSection ? el("td", {}, el("span", { "class": "pill" }, esc(secLabel(r.section)))) : "") +
    el("td", {}, el("b", {}, esc(r.title || "Untitled")) +
      (r.notes ? el("div", { "class": "note" }, esc(r.notes)) : "")) +
    el("td", {}, esc(r.location || "—")) +
    el("td", {}, esc(r.reference || "—")) +
    el("td", {}, esc(r.contact || "—")) +
    el("td", {}, esc(r.reviewed || "—")) +
    el("td", {}, r.inBinder ? el("span", { "class": "pill blue" }, "Yes") : "—") +
    el("td", {}, statusPill(r)) +
    el("td", { style: "text-align:right;white-space:nowrap" },
      el("button", { "class": "btn ghost sm", "data-edit": r.id }, "Edit") + " " +
      el("button", { "class": "btn danger sm", "data-del": r.id }, "×")));
}

function recordTable(list, withSection) {
  if (!list.length) return el("div", { "class": "empty" },
    el("b", {}, "Nothing here yet") + "Add a record and note where the real thing is kept.");
  var heads = (withSection ? ["Section"] : []).concat(
    ["Record", "Where it is", "Reference", "Contact", "Reviewed", "Binder", "Status", ""]);
  return el("div", { "class": "tblwrap" }, el("table", {},
    el("tr", {}, heads.map(function (h) { return el("th", {}, h); }).join("")) +
    list.map(function (r) { return recordRow(r, withSection); }).join("")));
}

function viewRecords() {
  var list = STATE.records.slice().sort(function (a, b) {
    var ia = SECTIONS.map(function (s) { return s.id; }).indexOf(a.section);
    var ib = SECTIONS.map(function (s) { return s.id; }).indexOf(b.section);
    if (ia !== ib) return ia - ib;
    return String(a.title || "").localeCompare(String(b.title || ""));
  });
  return el("h2", {}, "All Records") +
    el("div", { "class": "sub" }, "Every record in one table. \"Where it is\" is the most important column — it is what a family actually needs.") +
    el("div", { "class": "row", style: "margin-bottom:12px" },
      el("button", { "class": "btn", "data-new": "1" }, "+ Add record") +
      el("button", { "class": "btn ghost", "data-csv": "1" }, "Export CSV")) +
    el("div", { "class": "card" }, recordTable(list, true));
}

function viewSections() {
  var tabs = SECTIONS.map(function (s) {
    var n = recordsIn(STATE.records, s.id).length;
    return el("button", { "class": "btn " + (SEC === s.id ? "" : "ghost") + " sm", "data-sec": s.id },
      esc(s.label) + " (" + n + ")");
  }).join(" ");
  var mine = recordsIn(STATE.records, SEC);
  var s = sectionById(SEC);
  var pct = completionPct(mine);

  return el("h2", {}, "By Section") +
    el("div", { "class": "sub" }, "Work through one section at a time. The five marked \"key\" are what a family needs first.") +
    el("div", { "class": "row", style: "margin-bottom:12px" }, tabs) +
    el("div", { "class": "card" },
      el("h3", {}, esc(s ? s.label : SEC) + (s && s.critical ? " — key section" : "")) +
      el("div", { "class": "row", style: "margin-bottom:10px" },
        el("span", { "class": "pill" }, mine.length + " record" + (mine.length === 1 ? "" : "s")) + " " +
        el("span", { "class": "pill " + (pct === null ? "" : pct === 100 ? "ok" : "amber") },
          pct === null ? "empty" : pct + "% complete") +
        el("button", { "class": "btn sm right", "data-new-sec": SEC }, "+ Add to " + esc(s ? s.label : SEC))) +
      recordTable(mine, false));
}

function viewGaps() {
  var t = todayISO(), g = gaps(STATE.records, t);
  var byKind = { "empty-section": [], "incomplete-record": [], "stale-record": [] };
  g.forEach(function (x) { if (byKind[x.kind]) byKind[x.kind].push(x); });

  function block(title, items, note) {
    return el("div", { "class": "card" }, el("h3", {}, title) +
      (items.length ? el("div", { "class": "tblwrap" }, el("table", {}, items.map(function (x) {
        return el("tr", {}, el("td", {}, esc(x.message)) +
          el("td", { style: "text-align:right;white-space:nowrap" },
            el("span", { "class": "pill " + (x.severity === "critical" ? "red" : "") }, esc(secLabel(x.section)))));
      }).join(""))) : el("div", { "class": "note" }, "None.")) +
      el("div", { "class": "note", style: "margin-top:8px" }, note));
  }

  var sev = countBySeverity(STATE.records, t);

  return el("h2", {}, "What's Missing") +
    el("div", { "class": "sub" }, "This page is the point of the whole file: it tells you what is not yet written down.") +
    el("div", { "class": "grid g3" },
      el("div", { "class": "card" }, el("h3", {}, "Critical") + el("div", { "class": "kpi " + (sev.critical ? "bad" : "") }, sev.critical)) +
      el("div", { "class": "card" }, el("h3", {}, "Other gaps") + el("div", { "class": "kpi warn" }, sev.normal)) +
      el("div", { "class": "card" }, el("h3", {}, "Total records") + el("div", { "class": "kpi ink" }, STATE.records.length))) +
    el("div", { style: "height:14px" }) +
    block("Sections with nothing in them", byKind["empty-section"],
      "A key section with no records is the biggest gap there is.") +
    el("div", { style: "height:14px" }) +
    block("Records missing information", byKind["incomplete-record"],
      "A record without a location tells a family the thing exists but not where to find it — that is why it counts as critical.") +
    el("div", { style: "height:14px" }) +
    block("Records that need re-checking", byKind["stale-record"],
      "Accounts close, policies lapse and people move. Anything over " + REVIEW_MONTHS + " months old is worth confirming.");
}

function viewContacts() {
  var list = recordsIn(STATE.records, "contacts");
  var prim = primaryContacts(STATE.records);
  return el("h2", {}, "Key Contacts") +
    el("div", { "class": "sub" }, "The people to reach, and who to reach first. Mark a contact as first-call when you edit it.") +
    el("div", { "class": "grid g2" },
      el("div", { "class": "card" }, el("h3", {}, "First people to call") +
        (prim.length ? el("div", { "class": "tblwrap" }, el("table", {}, prim.map(function (r) {
          return el("tr", {}, el("td", {}, el("b", {}, esc(r.title)) +
            el("div", { "class": "note" }, esc(r.contact || r.location || ""))) +
            el("td", { style: "text-align:right" }, el("span", { "class": "pill ok" }, "First call")));
        }).join(""))) : el("div", { "class": "note" }, "No first-call contact marked yet. Edit a contact and tick \"first person to call\"."))) +
      el("div", { "class": "card" }, el("h3", {}, "Everyone recorded") +
        el("div", { "class": "note", style: "margin-bottom:8px" }, list.length + " contact" + (list.length === 1 ? "" : "s")) +
        el("button", { "class": "btn sm", "data-new-sec": "contacts" }, "+ Add contact"))) +
    el("div", { style: "height:14px" }) +
    el("div", { "class": "card" }, recordTable(list, false));
}

function viewWishes() {
  var list = recordsIn(STATE.records, "wishes");
  return el("h2", {}, "Final Wishes") +
    el("div", { "class": "sub" }, "Preferences you want known, and where the written version is kept.") +
    el("div", { "class": "card" },
      el("h3", {}, "Before you fill this in") +
      el("div", { "class": "note" },
        "This section records <b>where your wishes are written and what they broadly are</b>. It is not a will and it is not a legal document. " +
        "For anything that has to be legally binding — a will, an advance directive, power of attorney — speak to a qualified professional in your own country and note here where that document is kept.")) +
    el("div", { style: "height:14px" }) +
    el("div", { "class": "row", style: "margin-bottom:12px" },
      el("button", { "class": "btn", "data-new-sec": "wishes" }, "+ Add a wish or preference")) +
    el("div", { "class": "card" }, recordTable(list, false));
}

function viewBinder() {
  var pack = printPack(STATE.records);
  var groups = {};
  pack.forEach(function (r) { if (!groups[r.section]) groups[r.section] = []; groups[r.section].push(r); });

  var body = SECTIONS.filter(function (s) { return groups[s.id]; }).map(function (s) {
    return el("div", { "class": "card" }, el("h3", {}, esc(s.label)) +
      el("div", { "class": "tblwrap" }, el("table", {},
        el("tr", {}, ["Record", "Where it is", "Reference", "Contact"].map(function (h) { return el("th", {}, h); }).join("")) +
        groups[s.id].map(function (r) {
          return el("tr", {}, el("td", {}, esc(r.title)) + el("td", {}, esc(r.location || "—")) +
            el("td", {}, esc(r.reference || "—")) + el("td", {}, esc(r.contact || "—")));
        }).join(""))));
  }).join('<div style="height:14px"></div>');

  return el("h2", {}, "Print Pack") +
    el("div", { "class": "sub" }, "Only the records you ticked for the binder, grouped and laid out to print cleanly.") +
    el("div", { "class": "row", style: "margin-bottom:12px" },
      el("button", { "class": "btn", "data-print": "1" }, "Print this pack") +
      el("span", { "class": "note" }, pack.length + " of " + STATE.records.length + " records marked for the binder")) +
    (pack.length ? body : el("div", { "class": "card" }, el("div", { "class": "empty" },
      el("b", {}, "Nothing marked for the binder yet") +
      "Edit a record and tick \"include in printed binder\" to build the pack."))) +
    el("div", { style: "height:14px" }) +
    el("div", { "class": "card" }, el("h3", {}, "A note on what to print") +
      el("div", { "class": "note" }, "Print the pack, not your passwords. This file deliberately has no password field — " +
        "record <i>where</i> the password manager is and keep the master password somewhere separate and sealed."));
}

function viewReports() {
  var t = todayISO(), r = summaryReport(STATE, t);
  var secRows = SECTIONS.map(function (s) {
    var d = r.sections[s.id];
    return el("tr", {}, el("td", {}, esc(s.label)) + el("td", {}, d.count) +
      el("td", {}, d.complete) + el("td", {}, d.count ? d.pct + "%" : "—") +
      el("td", {}, s.critical ? "key" : ""));
  }).join("");

  return el("h2", {}, "Reports") +
    el("div", { "class": "sub" }, "A snapshot to print, or to check once a year when you review everything.") +
    el("div", { "class": "grid g4" },
      el("div", { "class": "card" }, el("h3", {}, "Readiness") + el("div", { "class": "kpi" }, r.readiness + "%")) +
      el("div", { "class": "card" }, el("h3", {}, "Records") + el("div", { "class": "kpi ink" }, r.total)) +
      el("div", { "class": "card" }, el("h3", {}, "Critical gaps") + el("div", { "class": "kpi " + (r.criticalGaps ? "bad" : "") }, r.criticalGaps)) +
      el("div", { "class": "card" }, el("h3", {}, "Needs review") + el("div", { "class": "kpi warn" }, r.stale))) +
    el("div", { style: "height:14px" }) +
    el("div", { "class": "card" }, el("h3", {}, "Completion by section") +
      el("div", { "class": "tblwrap" }, el("table", {},
        el("tr", {}, ["Section", "Records", "Complete", "%", ""].map(function (h) { return el("th", {}, h); }).join("")) + secRows))) +
    el("div", { style: "height:14px" }) +
    el("div", { "class": "card" }, el("h3", {}, "Data & backup") +
      el("div", { "class": "row" },
        el("button", { "class": "btn ghost", "data-csv": "1" }, "Export records CSV") +
        el("button", { "class": "btn ghost", "data-backup": "1" }, "Export backup (JSON)") +
        el("button", { "class": "btn ghost", "data-restore": "1" }, "Restore backup") +
        el("button", { "class": "btn ghost", "data-print": "1" }, "Print report") +
        el("button", { "class": "btn danger", "data-reset": "1" }, "Clear all data")) +
      el("div", { "class": "note" }, "Everything stays in this browser. Nothing is uploaded. Export a backup before clearing your browser or moving computers, and keep that backup somewhere as secure as the records themselves.") +
      el("input", { type: "file", id: "restoreFile", accept: ".json,application/json", style: "display:none" }));
}

/* ---------- modal ---------- */

function modalRecord() {
  var r = EDIT ? (function () {
    for (var i = 0; i < STATE.records.length; i++) if (STATE.records[i].id === EDIT) return STATE.records[i];
    return null;
  })() : null;
  var d = r || { section: SEC, title: "", location: "", reference: "", contact: "", reviewed: todayISO(), inBinder: true, primary: false, notes: "" };
  var isContact = d.section === "contacts";
  return el("div", { "class": "sheet" },
    el("h3", {}, r ? "Edit record" : "New record") +
    el("div", { "class": "grid g2" },
      el("div", { "class": "f" }, el("label", {}, "Section") + el("select", { id: "fSec" }, secOpts(d.section))) +
      el("div", { "class": "f" }, el("label", {}, "Last reviewed") + el("input", { id: "fRev", type: "date", value: esc(d.reviewed) }))) +
    el("div", { "class": "f" }, el("label", {}, "What is it") + el("input", { id: "fTitle", value: esc(d.title), placeholder: "e.g. Life insurance policy" })) +
    el("div", { "class": "f" }, el("label", {}, "Where it is kept") +
      el("input", { id: "fLoc", value: esc(d.location), placeholder: "e.g. Blue folder, filing cabinet in study" }) +
      el("div", { "class": "note" }, "The single most useful field in this file. Be specific enough that someone else could walk to it.")) +
    el("div", { "class": "grid g2" },
      el("div", { "class": "f" }, el("label", {}, "Reference (optional)") + el("input", { id: "fRef", value: esc(d.reference), placeholder: "e.g. ends 4821" })) +
      el("div", { "class": "f" }, el("label", {}, "Who to contact (optional)") + el("input", { id: "fCon", value: esc(d.contact), placeholder: "e.g. the provider or solicitor" }))) +
    el("div", { "class": "note", style: "margin-bottom:10px" },
      "Do not write full account numbers, PINs or passwords here. A partial reference is enough to identify the account.") +
    el("div", { "class": "f" }, el("label", {}, "Notes") + el("textarea", { id: "fNotes", rows: "2" }, esc(d.notes || ""))) +
    el("div", { "class": "row", style: "margin-bottom:12px" },
      el("label", { style: "text-transform:none;letter-spacing:0;font-weight:600;margin:0" },
        el("input", { type: "checkbox", id: "fBinder", checked: d.inBinder ? "checked" : null, style: "width:auto;margin-right:7px" }) +
        "Include in printed binder")) +
    (isContact ? el("div", { "class": "row", style: "margin-bottom:12px" },
      el("label", { style: "text-transform:none;letter-spacing:0;font-weight:600;margin:0" },
        el("input", { type: "checkbox", id: "fPrimary", checked: d.primary ? "checked" : null, style: "width:auto;margin-right:7px" }) +
        "First person to call")) : "") +
    el("div", { "class": "row" }, el("button", { "class": "btn", "data-save": "1" }, "Save") +
      el("button", { "class": "btn ghost", "data-close": "1" }, "Cancel")));
}

/* ---------- render ---------- */

function render() {
  var body =
    VIEW === "dash" ? viewDash() :
      VIEW === "records" ? viewRecords() :
        VIEW === "sections" ? viewSections() :
          VIEW === "gaps" ? viewGaps() :
            VIEW === "contacts" ? viewContacts() :
              VIEW === "wishes" ? viewWishes() :
                VIEW === "binder" ? viewBinder() :
                  VIEW === "reports" ? viewReports() : "";

  var tabs = TABS.map(function (t) {
    return el("button", { "class": "tab" + (VIEW === t[0] ? " on" : ""), "data-tab": t[0] }, t[1]);
  }).join("");

  document.getElementById("app").innerHTML =
    el("div", { "class": "top" },
      el("div", { "class": "brand" }, el("span", { "class": "dot" }) +
        el("span", {}, "Legacy &amp; Emergency Records" + el("small", {}, "LEDGERLOOPSTUDIO"))) +
      el("div", { "class": "tabs" }, tabs +
        el("button", { "class": "tab", "data-toggledark": "1" }, STATE.settings.dark === "1" ? "☀ Light" : "☾ Dark"))) +
    el("div", { "class": "wrap" }, body +
      el("div", { "class": "foot" }, "Works offline · no account · no subscription · your records stay in this browser<br>" +
        "This organises records. It is not legal or financial advice.")) +
    (MODAL === "record" ? el("div", { "class": "modal", "data-modal": "1" }, modalRecord()) : "");
}

function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
function chk(id) { var e = document.getElementById(id); return !!(e && e.checked); }

function download(name, text, mime) {
  var b = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(u); }, 1200);
}

document.addEventListener("click", function (ev) {
  var t = ev.target;
  if (!(t && t.getAttribute)) return;
  var g = function (k) { return t.getAttribute(k); };

  if (g("data-tab")) { VIEW = g("data-tab"); MODAL = null; EDIT = null; render(); return; }
  if (g("data-sec")) { SEC = g("data-sec"); render(); return; }
  if (g("data-toggledark")) {
    STATE.settings.dark = STATE.settings.dark === "1" ? "0" : "1";
    document.documentElement.setAttribute("data-dark", STATE.settings.dark); save(); render(); return;
  }
  if (g("data-close") || (g("data-modal") && t.className === "modal")) { MODAL = null; EDIT = null; render(); return; }

  if (g("data-new")) { MODAL = "record"; EDIT = null; render(); return; }
  if (g("data-new-sec")) { SEC = g("data-new-sec"); MODAL = "record"; EDIT = null; render(); return; }
  if (g("data-edit")) { MODAL = "record"; EDIT = g("data-edit"); render(); return; }
  if (g("data-del")) {
    var id = g("data-del");
    if (confirm("Delete this record?")) {
      STATE.records = STATE.records.filter(function (r) { return r.id !== id; });
      save(); render();
    } return;
  }
  if (g("data-save")) {
    var title = val("fTitle").trim();
    if (!title) { alert("Give the record a name so you know what it refers to."); return; }
    var rec = {
      id: EDIT || uid(), section: val("fSec"), title: title, location: val("fLoc").trim(),
      reference: val("fRef"), contact: val("fCon"), reviewed: val("fRev"),
      inBinder: chk("fBinder"), notes: val("fNotes")
    };
    if (rec.section === "contacts") rec.primary = chk("fPrimary");
    if (EDIT) { STATE.records = STATE.records.map(function (r) { return r.id === EDIT ? rec : r; }); }
    else { if(demoLimitReached()) return; STATE.records.push(rec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  if (g("data-csv")) { download("legacy-records.csv", toCSV(STATE.records), "text/csv;charset=utf-8"); return; }
  if (g("data-backup")) { download("legacy-records-backup.json", JSON.stringify(STATE, null, 2), "application/json"); return; }
  if (g("data-restore")) { var f = document.getElementById("restoreFile"); if (f) f.click(); return; }
  if (g("data-print")) { window.print(); return; }
  if (g("data-reset")) {
    if (confirm("Clear ALL records in this browser? Export a backup first if you might want them back.")) {
      STATE = blank(); save(); VIEW = "dash"; render();
    } return;
  }
});

document.addEventListener("change", function (ev) {
  if (ev.target && ev.target.id === "restoreFile") {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var obj = JSON.parse(rd.result);
        if (!obj || !obj.records) throw new Error("bad");
        STATE = obj;
        if (!STATE.settings) STATE.settings = { dark: "0", owner: "", updated: "" };
        document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
        save(); render(); alert("Backup restored.");
      } catch (e) { alert("That file could not be read as a backup."); }
    };
    rd.readAsText(file);
  }
});

load();
render();
</script>
